# Posts or updates ONE sticky comment from the lintel workflow's artifact.
# Runs in the base repository's context with a write token, so it must never execute PR code:
# it checks out the default branch, reads JSON, and renders it with trusted code.
name: lintel-comment

on:
  workflow_run:
    workflows: [lintel]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    concurrency:
      group: lintel-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: build lintel (default branch)
        run: |
          corepack enable
          pnpm install --frozen-lockfile --silent
          pnpm build > /dev/null

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lintel-findings
          path: findings
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: verify the artifact belongs to this pull request's current head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(jq -r '.number | select(type == "number")' findings/pr.json)
          if [ -z "$number" ]; then echo "no pull request number in artifact"; exit 1; fi
          current=$(gh api "repos/$REPO/pulls/$number" --jq .head.sha)
          if [ "$current" != "$RUN_HEAD_SHA" ]; then
            echo "::notice::skipping: PR #$number head is $current, this run checked $RUN_HEAD_SHA (stale or mismatched)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          fail_on=$(jq -r '.fail_on' findings/pr.json)
          case "$fail_on" in error|warn|info|none) ;; *) fail_on=error ;; esac
          { echo "number=$number"; echo "fail_on=$fail_on"; echo "skip=false"; } >> "$GITHUB_OUTPUT"

      - name: render and upsert the sticky comment
        if: steps.pr.outputs.skip == 'false' && hashFiles('findings/base.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          FAIL_ON: ${{ steps.pr.outputs.fail_on }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- lintel:v1"))) | .id' | head -n1)
          : > previous.md
          if [ -n "$id" ]; then gh api "repos/$REPO/issues/comments/$id" --jq .body > previous.md; fi
          node dist/cli.js diff findings/base.json findings/head.json --format markdown \
            --fail-on "$FAIL_ON" --previous-comment previous.md > comment.md || true
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
